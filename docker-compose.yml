services:
  db:
    image: postgres:15
    container_name: aad_db_container
    restart: always
    environment:
      POSTGRES_DB: aad_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: